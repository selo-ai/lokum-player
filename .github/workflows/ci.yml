name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Existing warnings and lints are left for a cleanup pass; errors fail the build.
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Signed with the debug key until a release keystore is set up; fine for sideloading test builds.
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: lokum-player-apk
          path: build/app/outputs/flutter-apk/app-release.apk
